name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute artifact suffix
        id: meta
        # Artifact names cannot contain "/", so flatten the branch name.
        run: echo "slug=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: energydrink-debug-apk-${{ steps.meta.outputs.slug }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ steps.meta.outputs.slug }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 30

  release-aab:
    name: Release AAB
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute artifact suffix
        id: meta
        # Artifact names cannot contain "/", so flatten the branch name.
        run: echo "slug=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Signing is optional: without the KEYSTORE_BASE64 secret the build still
      # runs and produces an unsigned bundle, which Play will not accept.
      - name: Decode upload keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"

          # Tolerate wrapped lines, CRLF and stray whitespace in the secret:
          # base64 accepts newlines but rejects carriage returns.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w0 upload-keystore.jks"
            exit 1
          fi

          # Fail here, with a message that names the culprit, rather than letting
          # Gradle fail later with a generic signing error.
          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Could not open the decoded keystore. Check that KEYSTORE_BASE64 holds the .jks file itself and that KEYSTORE_PASSWORD is its store password."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Alias '$KEY_ALIAS' is not in the keystore. Check the KEY_ALIAS secret; 'keytool -list -keystore <file>' shows the aliases it holds."
            exit 1
          fi

          echo "KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Bundle release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      # Verifies the signature rather than just looking for a signature block, and
      # treats "secrets are set but the bundle came out unsigned" as a hard error -
      # a misconfigured key must not pass silently. Without any secrets configured
      # the unsigned bundle is only a warning, so forks can still build.
      - name: Verify the bundle is signed
        run: |
          aab=$(ls app/build/outputs/bundle/release/*.aab)
          if jarsigner -verify "$aab" 2>&1 | grep -q 'jar verified'; then
            echo "Signed: $aab"
            jarsigner -verify -verbose:summary -certs "$aab" 2>&1 |
              grep -E '^ *X\.509|smk? ' | head -5
          elif [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Signing secrets are set but $aab came out unsigned - check KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          else
            echo "::warning::$aab is UNSIGNED - set the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets to sign it."
          fi

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: energydrink-release-aab-${{ steps.meta.outputs.slug }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
